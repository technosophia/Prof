# pydoc-markdown.yml
loaders:
  - type: python
    search_path: [.]
    modules:
      - app
      - shared.__init__
      - shared.logging
      - shared.config
      - shared.translate
      - shared.llm
      - shared.database
      - shared.users
      - shared.ui_registry

processors:
  - type: filter
    expression: "obj.docstring and '[agent]' in str(obj.docstring)"

renderer:
  type: markdown
  filename: AGENTS.md
