# pydoc-markdown.yml
loaders:
  - type: python
    search_path: [.]
    modules:
      - app
      - core.database
      - shared.common
      - shared.llm
      - shared.ui_registry
      - shared.module_handler

processors:
  - type: filter
    expression: "obj.docstring and '[agent]' in str(obj.docstring)"

renderer:
  type: markdown
  filename: AGENTS.md
