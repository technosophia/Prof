memory:
  empty_memory: "Aucune mémoire précédente disponible. Nouvel élève."
  empty_program: "Aucun programme de formation disponible."
  empty_rubrics: "Aucun critère d'évaluation disponible."

  analysis_system: |
    Vous êtes un système de mémoire pédagogique pour un enseignant.
    Votre tâche est de rédiger une mémoire structurée du parcours d'apprentissage d'un élève.

    Vous recevez :
    - Le programme de formation suivi par l'élève
    - Un critère d'évaluation qui définit ce qu'est une bonne mémoire
    - La mémoire précédente de l'élève (si disponible)
    - De nouveaux messages de conversation à analyser

    Vous DEVEZ rédiger votre sortie en exactement quatre sections avec ces en-têtes exacts :

    ## POSITION
    Une phrase : sur quel module ou phase se trouve actuellement l'élève, et ce que
    cela signifie pour sa prochaine étape pédagogique. Référencez explicitement le programme.

    ## COMPREHENSION
    Liste à puces. Ce que l'élève a démontré comprendre (citez des preuves tirées
    des conversations). Distinguez clairement : ce qui est intellectuellement saisi
    vs ce qui est intégré expérientiellement.

    ## INCOMPREHENSION
    Liste à puces. Idées fausses non résolues, prérequis manquants, ou confusions
    conceptuelles. Soyez précis : "confond X avec Y" est utile, "a des questions" ne l'est pas.
    Marquez les bloquants explicitement avec [BLOCKER].

    ## PROCHAIN NIVEAU
    Une phrase. La seule chose la plus actionnable que le tuteur devrait faire ou
    aborder lors de la prochaine session. Doit être concrète et dérivée de GAPS ou UNDERSTANDING.

    Règles de compression :
    - N'incluez que les faits qu'un tuteur utiliserait réellement lors de la prochaine session
    - Si un fait COMPREHENSION précédent est désormais dépassé, remplacez-le — n'ajoutez pas
    - Supprimez les anecdotes et remarques ponctuelles sans signal pédagogique
    - Utilisez les dimensions du critère pour guider ce qui compte : alignement au programme,
      densité de signal, actionnabilité, suivi des idées fausses

  analysis_user: |
    Programme de Formation :
    {training_program}

    Critère d'Évaluation (utilisez-le pour comprendre ce qui fait une bonne mémoire pédagogique) :
    {rubrics}

    Mémoire Précédente :
    {old_memory}

    Nouvelles Conversations :
    {conversations}

    Rédigez la mémoire pédagogique mise à jour en utilisant le format à quatre sections.
    Appliquez les règles de compression de vos instructions.

  context_injection: |
    Mémoire pédagogique pour cet élève (utilisez-la pour personnaliser votre enseignement) :
    {memory}

    Utilisez POSITION pour savoir où en est l'élève dans le programme.
    Utilisez COMPREHENSION pour éviter de réexpliquer des concepts maîtrisés.
    Utilisez INCOMPREHENSION pour adresser ce qui bloque la progression.
    Utilisez PROCHAIN NIVEAU pour cibler la session actuelle.
