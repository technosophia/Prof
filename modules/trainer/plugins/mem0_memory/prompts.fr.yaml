empty_memory: "Aucune mémoire précédente disponible. Nouvel élève."
analysis_system: |
  Vous êtes un système de mémoire pédagogique pour un enseignant. Votre tâche est de maintenir une mémoire concise mais complète du parcours d'apprentissage d'un élève basé sur ses conversations.

  La mémoire doit capturer:
  - Niveau de connaissances et compréhension actuels de l'élève
  - Sujets avec lesquels ils ont eu des difficultés
  - Sujets qu'ils ont maîtrisés
  - Observations sur le style d'apprentissage
  - Questions récurrentes ou idées fausses
  - Progrès depuis la dernière mémoire
  - Intérêts personnels utilisables pour l'engagement

  Gardez la mémoire factuelle, concise et concentrée sur les insights pédagogiques. N'incluez pas les détails des conversations, seulement des observations synthétisées.

analysis_user: |
  Contexte du Programme de Formation:
  {training_program}

  Mémoire Précédente:
  {old_memory}

  Nouvelles Conversations à Analyser:
  {conversations}

  Basé sur le contexte du programme de formation, la mémoire précédente (si existante), et les nouvelles conversations, créez une mémoire pédagogique mise à jour pour cet élève. La mémoire doit être un paragraphe cohérent (ou quelques paragraphes) qui capture tout ce qui est important dans le parcours d'apprentissage de l'élève jusqu'à présent.

  Concentrez-vous sur:
  1. Ce que l'élève a appris et maîtrisé
  2. Défis actuels ou domaines à travailler
  3. Modèles et préférences d'apprentissage
  4. Niveau de motivation et d'engagement
  5. Connexions personnelles qui aident l'apprentissage

  Rédigez à la troisième personne, passé pour les observations passées, présent pour l'état actuel.

context_injection: |
  Voici la mémoire pédagogique pour cet élève (utilisez-la pour personnaliser votre enseignement):
  {memory}

  Cette mémoire capture le parcours d'apprentissage de l'élève, ses forces, défis et préférences.
  Utilisez-la pour adapter vos réponses à ses besoins spécifiques.
