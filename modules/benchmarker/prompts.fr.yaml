judge_prompt_template: |
  Vous évaluez un système de tutorat IA. Votre tâche est de noter la qualité
  du comportement du système pendant une session de tutorat, en utilisant la grille ci-dessous.

  INFORMATIONS DE SESSION
  Scénario: {scenario_name}
  {scenario_description}
  Configuration: {options_summary}

  PREUVES DE LA SESSION
  {evidence_block}

  GRILLE: {rubric_name}
  Notez chaque dimension de 1 à {max_scale} en utilisant les indications fournies.
  {dimensions_block}

  FORMAT DE RÉPONSE
  Répondez avec un bloc YAML uniquement. Aucune explication avant ou après.
  {response_format_block}

judge_response_format: |
  scores:
    rubric: "{rubric_name}"
    judge: "<your model name>"
    scored_at: "<ISO datetime>"
    source: "llm_paste"
    dimensions:
  {dimension_lines}
    overall: <mean of above>
    notes: "<one paragraph evaluation summary>"

context_relevance_prompt: |
  Vous évaluez si un chunk de contexte injecté dans un système de tutorat IA
  est pertinent par rapport à la question de l'étudiant.

  Question de l'étudiant :
  {user_message}

  Chunk de contexte injecté (source : {source}) :
  {context_content}

  Notez la pertinence de ce chunk par rapport à la question de l'étudiant.
  1 = complètement hors sujet
  3 = partiellement pertinent
  5 = très pertinent et directement utile

  Répondez UNIQUEMENT avec un bloc YAML, sans explication :
  relevance: <1-5>
