judge_prompt_template: |
  You are evaluating an AI tutoring system. Your task is to score the quality
  of the system's behaviour during a tutoring session, using the rubric below.

  SESSION INFORMATION
  Scenario: {scenario_name}
  {scenario_description}
  Configuration: {options_summary}

  EVIDENCE FROM THE SESSION
  {evidence_block}

  RUBRIC: {rubric_name}
  Score each dimension from 1 to {max_scale} using the guidance provided.
  {dimensions_block}

  RESPONSE FORMAT
  Respond with a YAML block only. No explanation before or after.
  {response_format_block}

judge_response_format: |
  scores:
    rubric: "{rubric_name}"
    judge: "<your model name>"
    scored_at: "<ISO datetime>"
    source: "llm_paste"
    dimensions:
  {dimension_lines}
    overall: <mean of above>
    notes: "<one paragraph evaluation summary>"

context_relevance_prompt: |
  You are evaluating whether a context chunk injected into an AI tutoring system
  is relevant to the student's question.

  Student question:
  {user_message}

  Injected context chunk (source: {source}):
  {context_content}

  Score the relevance of this context chunk to the student's question.
  1 = completely irrelevant
  3 = partially relevant
  5 = highly relevant and directly useful

  Respond ONLY with a YAML block, no explanation:
  relevance: <1-5>
