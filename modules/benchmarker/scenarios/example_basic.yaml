# Actor reference:
# - student: actions taken by the student (uses student_id from setup)
# - teacher: actions taken by the trainer (uses trainer_id from setup)
# - system: setup and configuration actions (no user context required)
meta:
  name: "basic_student_teacher"
  description: >
    One student sends two messages.
    Validates that conversation is created and messages are sent.
  version: "1.0"

llm: "ollama_qwen"

setup:
  student_id: "normal2_m1"
  trainer_id: "master1"

steps:
  - id: "s1"
    actor: system
    action: create_conversation
    params:
      title: "Week 1 - Introduction"

  - id: "s2"
    actor: student
    action: user_send_message
    params:
      content: "What is the difference between a list and a tuple in Python?"

  - id: "s3"
    actor: student
    action: user_send_message
    params:
      content: "Can I change a tuple after creating it?"

assertions:
  - id: "a1"
    type: action_succeeded
    description: "Conversation was created without error"
    params:
      step_id: "s1"

  - id: "a2"
    type: action_succeeded
    description: "First student message was sent"
    params:
      step_id: "s2"

  - id: "a3"
    type: action_succeeded
    description: "Second student message was sent"
    params:
      step_id: "s3"
