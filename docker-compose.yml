version: "2.4"

services:
  mysql:
    image: mysql:8.0
    container_name: coach_mysql
    restart: always
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD} # Add this to your .env
    volumes:
      # Persist MySQL data in the data directory
      - ./data/mysql:/var/lib/mysql
    networks:
      - internal
    ports:
      - "3306:3306" # Optional: expose to host if needed
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  streamlit_coach:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: 3.11.9
    image: streamlit-coach:python3.11.9
    container_name: coach_streamlit
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      # Mount the current directory to /app for live code updates
      - ./:/app
      # Mount data directory separately (for any SQLite fallback or other data)
      - ./data:/app/data
    networks:
      - traefik
      - internal
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_ENABLE_CORS=true
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # Virtual environment variables
      - VIRTUAL_ENV=/opt/venv
      - PATH=/opt/venv/bin:${PATH}
      # Database environment variables (passed through)
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DRIVER=${MYSQL_DRIVER}
      # Add your other environment variables here
      - GIT_TOKEN=${GIT_TOKEN}
      - PYTHON_VERSION=3.11.9
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.frontend.rule=Host:coach.yoga-pro.xyz"
      - "traefik.port=8501"
      - "traefik.frontend.entryPoints=https,http"


  fastapi_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: fastapi-frontend:latest
    container_name: coach_fastapi
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./:/app
      - ./data:/app/data
    networks:
      - traefik
      - internal
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DRIVER=${MYSQL_DRIVER}
      - JWT_SECRET=${JWT_SECRET}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.frontend.rule=Host:app.yoga-pro.xyz"
      - "traefik.port=8000"
      - "traefik.frontend.entryPoints=https,http"

networks:
  traefik:
    external:
      name: traefik
  internal:
    external: false
