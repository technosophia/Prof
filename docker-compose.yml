version: "2.4"

services:
  streamlit_coach:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: 3.11.9
    image: streamlit-coach:python3.11.9
    container_name: coach_streamlit
    restart: always
    volumes:
      # Mount the current directory to /app for live code updates
      - ./:/app
      # Mount data directory separately
      - ./data:/app/data
    networks:
      - traefik
      - internal
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_ENABLE_CORS=true
      - STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # Virtual environment variables
      - VIRTUAL_ENV=/opt/venv
      - PATH=/opt/venv/bin:${PATH}
      # Add your environment variables here
      - GIT_TOKEN=${GIT_TOKEN}
      - PYTHON_VERSION=3.11.9
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.frontend.rule=Host:coach.yoga-pro.xyz"
      - "traefik.port=8501"          # ← this is how v1 knows which port to proxy
      - "traefik.frontend.entryPoints=https,http"

networks:
  traefik:
    external:
      name: traefik
  internal:
    external: false
