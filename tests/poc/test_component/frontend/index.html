<!doctype html>
<html>
    <body>
        <div style="margin-bottom: 15px">
            <label for="api_key"><strong>Groq API Key:</strong></label>
            <input
                id="api_key"
                type="password"
                placeholder="Enter your Groq API key (hidden)"
                style="
                    width: 100%;
                    padding: 8px;
                    margin: 5px 0;
                    box-sizing: border-box;
                "
            />
        </div>

        <div style="margin-bottom: 15px">
            <strong>Received Prompt:</strong>
            <span id="python_value">Waiting...</span>
        </div>

        <div
            style="
                margin: 10px 0;
                padding: 12px;
                background-color: #f0f0f0;
                border-radius: 4px;
            "
        >
            <div><strong>Status:</strong> <span id="status">Ready</span></div>
            <div style="margin-top: 10px">
                <strong>Response:</strong>
                <pre
                    id="response"
                    style="
                        white-space: pre-wrap;
                        margin: 8px 0;
                        max-height: 400px;
                        overflow-y: auto;
                    "
                >
None yet</pre
                >
            </div>
        </div>

        <script>
            console.log("JS Component Ready");

            function sendToStreamlit(type, data) {
                window.parent.postMessage(
                    {
                        isStreamlitMessage: true,
                        type: type,
                        ...data,
                    },
                    "*",
                );
            }

            function setFrameHeight() {
                let height = document.body.scrollHeight + 40; // Buffer for padding/margins
                sendToStreamlit("streamlit:setFrameHeight", { height: height });
                console.log("JS: Set frame height to", height);
            }

            let isProcessing = false;

            function onMessage(event) {
                const data = event.data;
                if (data.type === "streamlit:render") {
                    const args = data.args;

                    console.log(
                        "JS: Received from Python - prompt:",
                        args.input_value,
                        "clicked:",
                        args.button_clicked,
                    );

                    // Update prompt display
                    const pythonValueEl =
                        document.getElementById("python_value");
                    if (pythonValueEl) {
                        pythonValueEl.textContent = args.input_value || "None";
                    }

                    // Reset status/response on new render (unless processing)
                    const statusEl = document.getElementById("status");
                    const responseEl = document.getElementById("response");
                    if (!isProcessing) {
                        if (statusEl) statusEl.textContent = "Ready";
                        if (responseEl) responseEl.textContent = "None yet";
                    }

                    // Process if button clicked
                    if (args.button_clicked && !isProcessing) {
                        isProcessing = true;

                        const apiKeyInput = document.getElementById("api_key");
                        const apiKey = apiKeyInput
                            ? apiKeyInput.value.trim()
                            : "";

                        if (!apiKey) {
                            const err = "Error: Please enter your Groq API key";
                            sendToStreamlit("streamlit:setComponentValue", {
                                value: err,
                            });
                            if (statusEl) statusEl.textContent = err;
                            if (responseEl) responseEl.textContent = "";
                            isProcessing = false;
                            setFrameHeight();
                            return;
                        }

                        const prompt = args.input_value?.trim();
                        if (!prompt) {
                            const err = "Error: No prompt provided";
                            sendToStreamlit("streamlit:setComponentValue", {
                                value: err,
                            });
                            if (statusEl) statusEl.textContent = err;
                            if (responseEl) responseEl.textContent = "";
                            isProcessing = false;
                            setFrameHeight();
                            return;
                        }

                        if (statusEl)
                            statusEl.textContent = "Calling Groq API...";
                        if (responseEl)
                            responseEl.textContent = "Generating response...";
                        setFrameHeight();

                        fetch(
                            "https://api.groq.com/openai/v1/chat/completions",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json",
                                    Authorization: "Bearer " + apiKey,
                                },
                                body: JSON.stringify({
                                    model: "llama-3.3-70b-versatile",
                                    messages: [
                                        { role: "user", content: prompt },
                                    ],
                                    temperature: 0.7,
                                    max_tokens: 2048,
                                }),
                            },
                        )
                            .then(async (res) => {
                                if (!res.ok) {
                                    const errData = await res.json();
                                    throw new Error(
                                        errData.error?.message ||
                                            `HTTP error ${res.status}`,
                                    );
                                }
                                return res.json();
                            })
                            .then((data) => {
                                const content =
                                    data.choices?.[0]?.message?.content?.trim() ||
                                    "No content received";
                                sendToStreamlit("streamlit:setComponentValue", {
                                    value: content,
                                });
                                if (responseEl)
                                    responseEl.textContent = content;
                                if (statusEl) statusEl.textContent = "Success";
                            })
                            .catch((err) => {
                                console.error("Groq API error:", err);
                                const errMsg =
                                    "API Error: " +
                                    (err.message || "Unknown error");
                                sendToStreamlit("streamlit:setComponentValue", {
                                    value: errMsg,
                                });
                                if (responseEl) responseEl.textContent = "";
                                if (statusEl) statusEl.textContent = errMsg;
                            })
                            .finally(() => {
                                isProcessing = false;
                                setFrameHeight();
                            });
                    }

                    // Always adjust height after render
                    setFrameHeight();
                }
            }

            document.addEventListener("DOMContentLoaded", function () {
                console.log("JS: DOM loaded");

                window.addEventListener("message", onMessage);

                sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });

                setFrameHeight();
            });
        </script>
    </body>
</html>
