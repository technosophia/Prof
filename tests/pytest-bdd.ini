[pytest]
# Add the tests directory to Python path
pythonpath = .
testpaths = tests
# Look for feature files
bdd_features_base_dir = tests/features
# Look for step definitions
bdd_features_base_dir = tests/step_defs
# Add verbose output
addopts = -v --tb=short
# Configure markers
markers =
    bdd: BDD tests
    unit: Unit tests
    integration: Integration tests
